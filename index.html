<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhaka Collegiate School</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #991b1b; --bg: #f8fafc; --text: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 30px; }
        header { background: white; border-bottom: 3px solid var(--primary); padding: 15px; text-align: center; }
        .lang-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; float: right; cursor: pointer; margin-top: -30px; }
        .hero { background: var(--primary); color: white; padding: 30px 20px; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: var(--primary); margin-bottom: 10px; font-size: 18px; }
        .search-box { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        .search-btn { background: var(--secondary); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .result-display { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; background: #f0fdf4; border: 1px solid #bbf7d0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .class-btn { background: #e2e8f0; border: none; padding: 12px; border-radius: 6px; font-weight: bold; color: var(--primary); cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>DCS Portal</h1>
        <button class="lang-btn" onclick="toggleLanguage()">বাং</button>
    </header>

    <div class="hero">
        <h2 style="color: white;" id="school-title">Dhaka Collegiate School</h2>
        <p id="hero-sub">Established: 1835 | Knowledge is Power</p>
    </div>

    <div class="container">
        <div class="card">
            <h2 id="title-result">Find Student Result</h2>
            <p id="desc-result" style="font-size: 13px; color: #64748b;">Enter Roll (1001 to 1005)</p>
            <div class="search-box">
                <input type="text" id="student-id" placeholder="Enter Roll...">
                <button class="search-btn" onclick="searchResult()" id="btn-search">Search Result</button>
            </div>
            <div id="result-zone" class="result-display"></div>
        </div>

        <div class="card">
            <h2 id="title-academic">Academic Information</h2>
            <div class="grid">
                <button class="class-btn" onclick="alert('Primary Section (Class 1-5): Foundation Education')">Class 1 - 5</button>
                <button class="class-btn" onclick="alert('Junior Secondary (Class 6-8): Core Curriculum')">Class 6 - 8</button>
                <button class="class-btn" onclick="alert('Class 9: Specialized Streams Intro')">Class 9</button>
                <button class="class-btn" onclick="alert('Class 10: SSC Preparation Framework')">Class 10</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        const studentDatabase = {
            "1001": { name: "Arif Rahman", gpa: "5.00", status: "Passed" },
            "1002": { name: "Tanvir Ahmed", gpa: "4.85", status: "Passed" },
            "1003": { name: "Sadia Islam", gpa: "5.00", status: "Passed" },
            "1004": { name: "Mashfiqul Hasan", gpa: "4.20", status: "Passed" },
            "1005": { name: "Nayeem Uddin", gpa: "3.90", status: "Passed" }
        };

        function searchResult() {
            const id = document.getElementById('student-id').value.trim();
            const zone = document.getElementById('result-zone');
            zone.style.display = "block";

            if(!id) {
                zone.innerHTML = "Please input a Roll number.";
                return;
            }

            if(studentDatabase[id]) {
                const data = studentDatabase[id];
                zone.innerHTML = `<strong>Name:</strong> ${data.name}<br><strong>GPA:</strong> ${data.gpa}<br><strong>Status:</strong> ${data.status}`;
            } else {
                zone.innerHTML = "Result not found! Try 1001, 1002, or 1003.";
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            document.getElementById('school-title').innerText = currentLang === 'en' ? "Dhaka Collegiate School" : "ঢাকা কলেজিয়েট স্কুল";
            document.getElementById('title-result').innerText = currentLang === 'en' ? "Find Student Result" : "শিক্ষার্থীর ফলাফল অনুসন্ধান";
        }
    </script>
</body>
</html>
